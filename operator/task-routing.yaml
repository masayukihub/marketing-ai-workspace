routing_version: "1.0"
default_language: zh-CN
default_market: JP
routing_principle: "用户表达业务目标；系统选择最小入口与内部模块。"

routing_precedence:
  - continuation_existing_project
  - exact_legacy_alias
  - semantic_route

legacy_aliases:
  "电商选品情报": {primary_entry: "$jp-commerce-insights", mode: SELECTION}
  "Amazon Keyword Miner": {primary_entry: "$jp-commerce-insights", mode: KEYWORD}
  "Amazon Competitor Reviews": {primary_entry: "$jp-commerce-insights", mode: COMPETITOR}
  "Amazon VOC Browser Scraper": {primary_entry: "$jp-commerce-insights", mode: VOC}
  "Amazon Listing Asset Capture": {primary_entry: "$jp-commerce-insights", mode: ASSET_CAPTURE}
  "Amazon Japan PDP Generator": {primary_entry: "$jp-commerce-content-flow", mode: FULL_FLOW}
  "Amazon Listing Creative": {primary_entry: "$jp-commerce-content-flow", mode: CREATIVE_EXPLORE}
  "Japan Listing Demo": {primary_entry: "$jp-commerce-content-flow", mode: RESUME}
  "JP Commerce Creative Flow": {primary_entry: "$jp-commerce-content-flow", mode: RESUME}
  "ecommerce-product-selection": {primary_entry: "$jp-commerce-insights", mode: SELECTION}
  "amazon-review-scraper": {primary_entry: "$jp-commerce-insights", mode: VOC}
  "amazon-competitor-reviews": {primary_entry: "$jp-commerce-insights", mode: COMPETITOR}
  "amazon-voc-browser-scraper": {primary_entry: "$jp-commerce-insights", mode: VOC}
  "amazon-keyword-miner": {primary_entry: "$jp-commerce-insights", mode: KEYWORD}
  "amazon-listing-asset-capture": {primary_entry: "$jp-commerce-insights", mode: ASSET_CAPTURE}
  "product-intel": {primary_entry: "$jp-commerce-insights", mode: COMPETITOR}
  "sorftime-market-intel": {primary_entry: "$jp-commerce-insights", mode: SELECTION}
  "amazon-japan-pdp-generator": {primary_entry: "$jp-commerce-content-flow", mode: FULL_FLOW}
  "amazon-listing-creative": {primary_entry: "$jp-commerce-content-flow", mode: CREATIVE_EXPLORE}
  "jp-commerce-creative-flow": {primary_entry: "$jp-commerce-content-flow", mode: RESUME}
  "japan-listing-demo": {primary_entry: "$jp-commerce-content-flow", mode: RESUME}
  "listing-planning": {primary_entry: "$jp-commerce-content-flow", mode: PLAN_ONLY}
  "listing-production": {primary_entry: "$jp-commerce-content-flow", mode: PRODUCE}
  "listing-hardening": {primary_entry: "$jp-commerce-content-flow", mode: HARDEN}
  "listing-evidence-auditor": {primary_entry: "$jp-commerce-content-flow", mode: HARDEN}

preflight:
  named_project:
    - confirm_latest_main_head
    - read_root_agents
    - read_operator_profile
    - resolve_project_manifest
    - evaluate_effective_freshness
    - load_task_scoped_context
  unnamed_project:
    - classify_as_projectless_task_or_project_bootstrap
    - do_not_auto_create_formal_project
  continuation_words:
    - "继续"
    - "下一步"
    - "接着做"
    - "继续这个项目"
  continuation_behavior: "选择第一个允许执行的未完成 Next Action，不重复已经批准的阶段。"

user_entries:
  jp-commerce-insights:
    label: 日本电商洞察
    skill: "$jp-commerce-insights"
    owns:
      - market_opportunity
      - keyword_research
      - competitor_analysis
      - voc_and_reviews
      - listing_evidence_capture
      - research_pack
    must_not_own:
      - product_truth_approval
      - final_consumer_copy
      - external_claim_approval
  jp-commerce-content-flow:
    label: 日本电商内容生成
    skill: "$jp-commerce-content-flow"
    owns:
      - amazon_gallery
      - amazon_a_plus
      - listing_copy
      - visual_brief
      - visual_production
      - content_review_html
      - hardening_and_delivery_qa
    must_not_own:
      - product_fact_invention
      - price_or_claim_approval
      - amazon_upload
  switchbot-japan-campaign:
    label: 日本营销活动策划与复盘
    skill: "$switchbot-japan-campaign"
    owns:
      - gtm_strategy
      - launch_readiness
      - project_execution
      - channel_asset_plan
      - tracking_and_measurement
      - kol_pr_program_control
      - campaign_review
    must_not_own:
      - product_truth_mutation
      - formal_feishu_write_without_authorization
      - external_publication
  switchbot-japan-edm:
    label: 日本EDM制作
    skill: "$switchbot-japan-edm"
    owns:
      - edm_strategy
      - japanese_copy
      - design_brief
      - responsive_html
      - desktop_mobile_visual
      - pre_send_qa
    must_not_own:
      - product_or_campaign_truth_invention
      - esp_send
      - final_publication

routes:
  - route_id: continue_existing_project
    user_intents:
      - "继续"
      - "下一步"
      - "接着做"
      - "继续这个项目"
    primary_entry: AUTO_FROM_NEXT_ACTION
    required_task_type: auto
    behavior:
      - resolve_current_project
      - select_first_incomplete_p0_then_p1_then_p2
      - preserve_blocker_dependencies
      - execute_to_next_material_human_gate
    output: concise_progress_or_review_pack

  - route_id: product_or_project_bootstrap
    user_intents:
      - "创建新品项目"
      - "导入产品资料"
      - "整理产品事实"
      - "建立项目"
      - "把这个产品加入系统"
    primary_entry: INTERNAL_GOVERNANCE
    internal_modules:
      - project-context-resolver
      - project-memory-manager
      - product-knowledge
    behavior:
      - return_project_bootstrap_required_when_no_formal_project
      - prepare_source_registry_and_truth_proposal
      - require_human_review_before_formal_writeback
    stop_gate: PRODUCT_OR_PROJECT_BOOTSTRAP_HUMAN_REVIEW
    forbidden:
      - auto_create_formal_product_truth
      - auto_approve_claim
      - auto_publish

  - route_id: japan_market_research
    user_intents:
      - "市场怎么样"
      - "调研新品"
      - "竞品"
      - "关键词"
      - "VOC"
      - "评论分析"
      - "用户障碍"
      - "Listing证据"
      - "电商选品情报"
      - "Amazon Keyword Miner"
      - "Amazon Competitor Reviews"
      - "Amazon VOC Browser Scraper"
      - "Amazon Listing Asset Capture"
    primary_entry: "$jp-commerce-insights"
    mode_selection:
      broad_research: FULL
      keyword_only: KEYWORD
      competitor_only: COMPETITOR
      voc_only: VOC
      asset_page_capture: ASSET_CAPTURE
      update_existing_pack: UPDATE
    output: Commerce_Insight_Pack
    handoff_to: "$jp-commerce-content-flow"

  - route_id: amazon_jp_content
    user_intents:
      - "Amazon页面"
      - "日亚页面"
      - "Gallery"
      - "A+"
      - "卖点图"
      - "Listing文案"
      - "Creative Brief"
      - "Review HTML"
      - "修改这张图"
      - "Amazon Japan PDP Generator"
      - "Amazon Listing Creative"
      - "Japan Listing Demo"
      - "JP Commerce Creative Flow"
    primary_entry: "$jp-commerce-content-flow"
    mode_selection:
      full_page: FULL_FLOW
      limited_assets: MVP
      strategy_only: PLAN_ONLY
      visual_direction_exploration: CREATIVE_EXPLORE
      approved_handoff_production: PRODUCE
      exact_local_change: LOCAL_REVISION
      continue_project: RESUME
      final_html_and_qa: HARDEN
    internal_modules:
      - jp-commerce-creative-flow
      - japan-listing-demo
      - amazon-japan-pdp-generator
      - amazon-listing-creative
      - visual-system
    rules:
      - "jp-commerce-content-flow 是唯一用户入口。"
      - "amazon-japan-pdp-generator 仅作为兼容 Renderer/Review 模块，不重新定义 Product Truth。"
      - "japan-listing-demo 负责成熟 Planning/Production/Hardening 能力时，由入口自动调度。"
      - "没有有效 Visual Freeze 时才运行 Visual Router；存在 accepted planning decision 时优先继承。"
    stop_gate: next_content_or_visual_human_review

  - route_id: campaign_gtm_and_project_management
    user_intents:
      - "GTM"
      - "上市计划"
      - "项目管理"
      - "周风险报告"
      - "渠道素材需求"
      - "活动策划"
      - "Launch Readiness"
      - "RACI"
      - "Tracking"
      - "UTM"
    primary_entry: "$switchbot-japan-campaign"
    mode_selection:
      strategy: PLAN
      readiness: READINESS
      execution_tracking: EXECUTION
      tracking_links: TRAFFIC
      review: REVIEW
      full_lifecycle: FULL
    internal_modules:
      - project-context-resolver
      - project-memory-manager
      - product-knowledge
      - switchbot-campaign-review
    output:
      - campaign_context
      - launch_readiness
      - owner_action_table
      - risk_and_decision_queue
      - channel_asset_plan
      - measurement_plan

  - route_id: campaign_review
    user_intents:
      - "活动复盘"
      - "渠道复盘"
      - "广告数据分析"
      - "ROI"
      - "SKU表现"
      - "PD复盘"
      - "BFCM复盘"
    primary_entry: "$switchbot-japan-campaign"
    primary_mode: REVIEW
    internal_modules:
      - switchbot-campaign-review
      - product-knowledge
    rules:
      - data_quality_before_kpi
      - aggregate_ratios_from_numerators_and_denominators
      - do_not_convert_correlation_to_causation
    output:
      - management_judgment
      - data_quality_report
      - channel_product_stage_analysis
      - continue_adjust_stop_add_actions
      - project_memory_proposal

  - route_id: edm_production
    user_intents:
      - "EDM"
      - "Newsletter"
      - "邮件文案"
      - "EDM HTML"
      - "EDM视觉"
      - "手机预览"
      - "发送前检查"
    primary_entry: "$switchbot-japan-edm"
    mode_selection:
      review_existing: CRITIQUE
      copy_only: COPY
      brief_only: DESIGN_BRIEF
      html_and_visual: HTML_VISUAL
      exact_change: LOCAL_REVISION
      continue_existing: RESUME
      final_send_check: SEND_READINESS
    internal_modules:
      - edm-generator
      - visual-system
    rules:
      - inherit_campaign_context_when_available
      - reuse_verified_formula_and_template
      - no_fixture_fallback_as_production
      - no_esp_send
    stop_gate: final_human_or_esp_gate

  - route_id: kol_creator_and_pr
    user_intents:
      - "KOL"
      - "YouTube红人"
      - "博主合作"
      - "PR媒体"
      - "媒体名单"
      - "合作Brief"
      - "过往合作复盘"
      - "红人名单"
    primary_entry: "$switchbot-japan-campaign"
    primary_mode: PLAN
    supporting_entries:
      - "$jp-commerce-insights"
    internal_modules:
      - influencer-marketing
      - customer-review-intelligence
      - switchbot-campaign-review
    required_outputs:
      - evidence_coverage
      - partner_or_media_segment
      - scored_shortlist_or_selection_criteria
      - collaboration_direction
      - brief
      - cost_and_kpi_expectation
      - tracking_and_usage_rights
      - outreach_draft_when_requested
    rules:
      - "名单必须记录平台、粉丝量/受众、内容方向、竞品经历、品牌冲突、来源和获取日期。"
      - "私人联系方式只保存在授权的私有数据源，不提交 GitHub。"
      - "KOL 与 PR 分开制定角色和 KPI，不用播放量替代媒体价值，也不用媒体曝光替代转化。"
      - "不自动发送邀约或修改飞书正式名单。"
    stop_gate: kol_pr_strategy_and_shortlist_human_review

  - route_id: visual_asset_or_social_creative
    user_intents:
      - "生成社媒图"
      - "Banner"
      - "KV"
      - "弹窗"
      - "视觉稿"
      - "产品渲染图"
    primary_entry: AUTO_BY_DESTINATION
    destination_mapping:
      amazon_or_pdp: "$jp-commerce-content-flow"
      edm: "$switchbot-japan-edm"
      campaign_or_social: "$switchbot-japan-campaign"
    internal_modules:
      - visual-system
    rules:
      - resolve_product_truth_and_asset_rights_first
      - reuse_valid_project_visual_decision
      - separate_scene_product_and_graphic_layers
      - official_product_body_only
      - generate_anchor_before_large_batch_when_direction_unlocked

  - route_id: japanese_copy_or_business_communication
    user_intents:
      - "日语邮件"
      - "日语文案"
      - "回复KOL"
      - "PR文案"
      - "SNS文案"
      - "LINE"
      - "App Push"
    primary_entry: AUTO_BY_BUSINESS_CONTEXT
    context_mapping:
      edm: "$switchbot-japan-edm"
      amazon: "$jp-commerce-content-flow"
      campaign_kol_pr_or_social: "$switchbot-japan-campaign"
    rules:
      - use_natural_japanese
      - preserve_confirmed_product_names_and_claim_scope
      - provide_copy_ready_output
      - avoid_overformal_customer_service_tone_for_kol

fallback:
  no_matching_route:
    action: "先完成任务分类，只读取最小 Context；不要新增用户可见 Skill。"
  missing_runtime:
    status: BLOCKED_RUNTIME_MISSING
    safe_outputs:
      - source_map
      - strategy
      - brief
      - review_pack
    forbidden_claim: "不得假装已运行 Renderer、浏览器 QA 或正式 Runtime。"
