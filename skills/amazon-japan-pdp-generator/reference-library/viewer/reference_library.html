hy","Making scenes carry unsupported claims","Hiding the product to achieve mood"]},{"pattern_id":"STORY-TECHNOLOGY-LED","name":"Technology-led","consumer_trigger":"The purchase depends on understanding an invisible mechanism, platform or system relationship.","recommended_sequence":["Human value","Technology concept","Mechanism","Proof condition","Real-world effect","Compatibility or ecosystem","FAQ"],"reference_asins":["B0GK1QFGF6","B0F66LKTV6","B0FWQY84L6"],"use":["Start with the user benefit before naming the technology","Use programmatic diagrams and source-linked labels","Show one lived consequence after each technical chapter"],"adapt":["Use dark contrast only for selected proof moments","Translate expert detail into Japanese consumer questions"],"avoid":["Technology logos as the story","All-dark uninterrupted pages","Invented UI, connector relationships or technical labels"]}]},"gallery":{"schema_version":"1.0","principle":"Gallery sequences are seven decision jobs, not seven feature slots. The first image remains the Amazon-compliant official main image.","sequences":[{"sequence_id":"GALLERY-FAMILIAR-TECH","best_for":["familiar consumer electronics","feature-comparison categories"],"reference_asins":["B0GK1QFGF6","B0FWQY84L6"],"roles":["Official Main","Value Hero","Primary Mechanism","Performance Proof","Real Scenario","Everyday Fit","Comparison or Purchase Confidence"],"logic":"Confirm the product, justify the value quickly, explain one decisive mechanism, prove it, then move into lived use and selection."},{"sequence_id":"GALLERY-NEW-CATEGORY","best_for":["AI hardware","new workflows","low category familiarity"],"reference_asins":["B0FQ5J7HFQ","B08131HFSG"],"roles":["Official Main","Problem or Audience Hero","What It Does","Input or Setup","Transformation or Mechanism","Tangible Outcome in Scenario","Fit and Conditions"],"logic":"Teach the job before listing capability. Keep the physical product visible between workflow and software outcomes."},{"sequence t_when":"The page needs to prove fit, routine or relief in a believable context.","reference_learning":"Levoit uses a dark bedroom as a rhythm change; Plaud uses work scenes to prove workflow fit.","boundaries":["One moment","Product remains accurate","Crop-safe face and product zones"]},{"template_id":"A-TECHNICAL","family":"aplus","primitive":"Large technical visual plus proof column","primary_role":"Technology","secondary_roles":["Proof","Detail"],"best_when":"The shopper needs mechanism, condition and consequence together.","reference_learning":"Soundcore demonstrates credibility; ECOVACS demonstrates why density must be capped.","boundaries":["Maximum three proof cards","Claim conditions remain adjacent","No invented diagram text"]},{"template_id":"A-INSTALLATION","family":"aplus","primitive":"Ordered two- or three-step sequence","primary_role":"Detail","secondary_roles":["Proof","Closure"],"best_when":"Setup effort or accessory sequence is a purchase barrier.","reference_learning":"Eufy's fit-first story shows installation information is confidence content, not a technical afterthought.","boundaries":["Verified steps only","Official installation assets","No inferred accessory or omitted prerequisite"]},{"template_id":"A-ECOSYSTEM","family":"aplus","primitive":"System relationship map with editable labels","primary_role":"Technology","secondary_roles":["Feature","Detail"],"best_when":"The product's value depends on verified devices, apps or platforms working together.","reference_learning":"Plaud's workflow chapters and Eufy's control closure show that relationship maps must follow the user's task.","boundaries":["Verified edges only","No invented UI","Spokes convert to vertical relationships on mobile"]},{"template_id":"A-COMPARISON","family":"aplus","primitive":"Wide source-backed selection matrix","primary_role":"Comparison","secondary_roles":["Proof","Closure"],"best_when":"The user must choose among current variants or understand a method difference.","reference_learning":"Comparison works as closure across all references but becomes exhausting when every row is treated equally.","boundaries":["Priority rows first","Uniform scale and current sources","Selection aid, not superiority theater"]},{"template_id":"A-FAQ","family":"aplus","primitive":"Stacked objection-response rows","primary_role":"Closure","secondary_roles":["Detail","Proof"],"best_when":"Compatibility, requirements or conditions remain after the story.","reference_learning":"Soundcore's FAQ converts a dense technical story into final purchase clarity.","boundaries":["Maximum three priority objections","Question and answer stay adjacent","No tiny disclaimer-only answers"]},{"template_id":"A-BRAND","family":"aplus","primitive":"Brand statement plus official product or scene","primary_role":"Closure","secondary_roles":["Hero","Proof"],"best_when":"An approved brand promise materially reduces purchase risk.","reference_learning":"Competitor Brand Stories often overuse awards; SwitchBot should use brand only when it supports the product decision.","boundaries":["One approved brand message","Official logo asset","No unsupported leadership or award claim"]}]}};</script>

    }
    current = reference.asin;
    document.querySelector("#app").innerHTML = `<div class="workspace"><aside class="rail"><input class="search" aria-label="Search references" placeholder="Search brand, product, ASIN"><div class="ref-list">${references.map((item) => `<button class="ref-button" data-asin="${esc(item.asin)}" aria-label="${esc(`${item.brand} ${item.product} ${item.asin} ${item.category}`)}" aria-current="${item.asin === reference.asin}"><strong>${esc(item.brand)} · ${esc(item.product)} · ${esc(item.asin)}</strong></button>`).join("")}</div></aside><article class="view"><section class="hero"><div class="hero-top">${pills(reference.page_type)}<span class="tag">${esc(reference.complexity)}</span></div><h2>${esc(reference.brand)}<br>${esc(reference.product)}</h2><p>${esc(reference.category)} · <a href="${esc(reference.source_url)}">Amazon source</a> · observed ${esc(reference.observed_on)}</p><p>${esc(reference.observation.mobile)}</p></section><div class="summary-strip"><section class="use"><h3>USE</h3>${bullets(reference.use)}</section><section class="adapt"><h3>ADAPT</h3>${bullets(reference.adapt)}</section><section class="avoid"><h3>AVOID</h3>${bullets(reference.avoid)}</section></div><section class="block"><h3>Visual Grammar</h3><div class="grammar">${Object.entries(reference.visual_patterns).map(([key, value]) => `<div><b>${esc(key.replaceAll("_", " "))}</b><span>${esc(value)}</span></div>`).join("")}</div></section><section class="block"><h3>Product Gallery · ${reference.gallery_patterns.length}</h3><p class="block-note">逐图记录 Consumer Question、角色、密度与有效原因。</p><div class="table-wrap"><table><thead><tr><th>#</th><th>Role / Type</th><th>Consumer Question</th><th>Main Message</th><th>Layout / Scale / Density</th><th>Why Effective</th></tr></thead><tbody>${reference.gallery_patterns.map((item) => `<tr><td class="num">${item.position}</td><td><b>${esc(item.image_role)}</b><br>${esc(item.content_type.join(" / "))}</td><td>${esc(item.consumer_question)}</td><td>${esc(item.main_message)}<br><small>${esc(item.feature)} → ${esc(item.benefit)}</small></td><td>${esc(item.layout_type)}<br>${esc(item.product_scale)} · ${esc(item.text_density)} · ${esc(item.background)}</td><td>${esc(item.why_effective)}</td></tr>`).join("")}</tbody></table></div></section><section class="block"><h3>A+ Structure · ${reference.aplus_patterns.length}</h3><p class="block-note">Major container level. Carousel内各卡片作为Interaction记录，不把卡片数误当成独立Story Module。</p><div class="table-wrap"><table><thead><tr><th>#</th><th>Module / Role</th><th>Message</th><th>Layout / Interaction</th><th>Presence / Density</th><th>Rhythm Relation</th></tr></thead><tbody>${reference.aplus_patterns.map((item) => `<tr><td class="num">${item.position}</td><td><b>${esc(item.module_type)}</b><br>${esc(item.story_role)}</td><td>${esc(item.message)}</td><td>${esc(item.layout)}<br>${esc(item.interaction_type)}</td><td>Visual ${esc(item.visual_density)}<br>Product ${esc(item.product_presence)} · Scene ${esc(item.scene_presence)} · Tech ${esc(item.technical_information)}</td><td>${esc(item.rhythm_relation)}</td></tr>`).join("")}</tbody></table></div></section></article></div>`;
    wireReferences();
  }
  function wireReferences() {
    document.querySelectorAll(".ref-button").forEach((button) => {
      button.onclick = () => { current = button.dataset.asin; renderReference(); };
    });
    const search = document.querySelector(".search");
    if (search) search.oninput = () => {
      const query = search.value.trim().toLowerCase();
      const filtered = data.references.filter((reference) => [reference.asin, reference.brand, reference.product, reference.category, ...reference.page_type].join(" ").toLowerCase().includes(query));
      renderReference(filtered.length ? filtered : data.references);
    };
  }
  function renderStory() {
    document.querySelector("#app").innerHTML = `<section class="block"><h3>Story Pattern Library</h3><p class="block-note">${esc(data.story.principle)}</p></section><div class="library-grid">${data.story.patterns.map((pattern) => `<article class="pattern"><p class="eyebrow">${esc(pattern.pattern_id)}</p><h3>${esc(pattern.name)}</h3><p>${esc(pattern.consumer_trigger)}</p><div class="sequence"><span>Sequence</span><br>${esc(pattern.recommended_sequence.join(" → "))}</div><b>USE</b>${bullets(pattern.use)}<b>ADAPT</b>${bullets(pattern.adapt)}<b>AVOID</b>${bullets(pattern.avoid)}</article>`).join("")}</div>`;
  }
  function renderSequences(kind, title, key) {
    const set = data[kind];
    document.querySelector("#app").innerHTML = `<section class="block"><h3>${esc(title)}</h3><p class="block-note">${esc(set.principle)}</p>${set.sequences.map((sequence) => `<div class="sequence"><p class="eyebrow">${esc(sequence.sequence_id)}</p><b>${esc(sequence.best_for.join(" / "))}</b><p>${esc(sequence[key].join(" → "))}</p><span>${esc(sequence.logic || sequence.rhythm)}</span></div>`).join("")}</section>`;
  }
  function renderLayout() {
    document.querySelector("#app").innerHTML = `<section class="block"><h3>19 Existing Templates → Layout Primitives</h3><p class="block-note">${esc(data.layout.principle)}</p>${data.layout.mappings.map((mapping) => `<div class="mapping"><code>${esc(mapping.template_id)}</code><div class="role">${esc(mapping.primary_role)}</div><div><b>${esc(mapping.primitive)}</b><p>${esc(mapping.best_when)}</p><p>Boundary: ${esc(mapping.boundaries.join(" · "))}</p></div></div>`).join("")}</section>`;
  }
  function render() {
    if (view === "references") renderReference();
    if (view === "story") renderStory();
    if (view === "gallery") renderSequences("gallery", "Gallery Sequence Library", "roles");
    if (view === "aplus") renderSequences("aplus", "A+ Sequence Library", "modules");
    if (view === "layout") renderLayout();
    document.querySelectorAll(".tab").forEach((button) => button.setAttribute("aria-selected", String(button.dataset.view === view)));
  }
  document.querySelectorAll(".tab").forEach((button) => {
    button.onclick = () => { view = button.dataset.view; render(); };
  });
  render();
})();</script>
</body>
</html>
