anti_patterns:
  - id: AP-01
    do_not: "output a production EDM without hero, primary message, primary CTA, or loaded critical images"
    confidence: High Confidence
  - id: AP-02
    do_not: "place more than one equal-weight primary message in hero"
    confidence: High Confidence
  - id: AP-03
    do_not: "place procedural steps, FAQ, compatibility wall, or long operational paragraphs in hero"
    confidence: High Confidence
  - id: AP-04
    do_not: "use placeholder, AI-redrawn, or unverified product body or UI"
    confidence: High Confidence
  - id: AP-05
    do_not: "use lifestyle imagery as the only product evidence"
    confidence: High Confidence
  - id: AP-06
    do_not: "give four or more promotion numbers or badges equal top visual weight"
    confidence: Medium Confidence
  - id: AP-07
    do_not: "use duplicate-meaning primary CTAs or an unnamed destination"
    confidence: High Confidence
  - id: AP-08
    do_not: "treat unrendered blank space or gallery chrome as a valid EDM pattern"
    confidence: High Confidence
  - id: AP-09
    do_not: "allow Tier D English copy, density, promotion, or CTA to override Tier A"
    confidence: High Confidence
  - id: AP-10
    do_not: "generalize SBG_005 sale density or SBG_017 premium art direction into the common baseline"
    confidence: High Confidence

