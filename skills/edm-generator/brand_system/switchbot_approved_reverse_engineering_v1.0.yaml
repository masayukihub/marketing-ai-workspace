version: 1.0.0
status: calibration_evidence
scope: SwitchBot Japan Tier A Approved EDM only
measurement:
  viewport_width_px: 600
  length_method: Browser-measured document scrollHeight from recovered Gmail HTML
  section_count_definition: Semantic macro stages from Phase 2 screenshot-level analysis
  module_count_definition: Top-level recovered mc:repeatable composition blocks; nested product cards and image tiles are not counted again
  tracking_pixel_policy: Ignore the intentionally empty 1x1 tracking GIF when evaluating visual completeness
  evidence_priority:
    - Tier A Approved SwitchBot EDM
    - Tier A Anchor References
    - Tier B SwitchBot support only
    - Tier C Japan localization supplement only
    - Tier D layout and hero inspiration only
samples:
  - reference_id: SBG_001
    campaign_type: Product Launch / Ecosystem
    total_length: 7043px
    section_count: 9
    module_count: 22
    module_sequence:
      - Hero + launch offer
      - Product family introduction
      - Product grid group 1
      - Product grid group 2
      - Lifestyle use cases
      - Feature and detail expansion
      - App / ecosystem explanation
      - Campaign reminder + CTA
      - Deep footer
    hero_structure: Product-centered family hero with launch message, visible offer and immediate campaign action
    product_visual_frequency: High — product or product-family imagery appears in about 8 composition blocks
    lifestyle_frequency: 3 visual beats
    cta_frequency: 5
    promotion_frequency: 3 campaign/commerce beats
    proof_frequency: 2
    footer_depth: Deep — campaign conditions, service/channel links and brand closure
    information_density: Medium, with high product-family breadth
    visual_rhythm: Product family → product cards → lifestyle relief → feature/detail → ecosystem → commerce reminder → footer
    brand_specific_patterns:
      - The product reappears after each lifestyle or ecosystem explanation
      - Product breadth is grouped into themed rows instead of one generic grid
      - CTA repetition is attached to different product or campaign destinations
    evidence:
      recovered_html: research/mobile_evidence/html/SBG_001.html
      recovered_full_image: output/playwright/phase5_5/approved/SBG_001_recovered.png
      original_gmail_screenshot: research/screenshots/SBG_001_smart_pet_launch_gmail_full.jpg

