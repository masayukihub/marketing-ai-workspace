version: 1.0.0-phase3-review
status: Human Review Required
baseline:
  markdown: standards/edm_design_standard_v1.0.md
  machine_rules: standards/edm_design_rules_v1.0.yaml
  traceability: standards/rule_traceability.csv
  phase3_brief: phase3_design_system_brief.md
taxonomy_policy:
  family_count: 6
  variant_count: 15
  merge_threshold: if structural difference is less than about 20%, keep as a Variant
    or merge
  scope: Template and Module design only; no Renderer, formal Skill, or production
    EDM
template_families:
- family_id: TF-LAUNCH
  family_name: Product Launch
  campaign_type: product_launch
  family_objective: 让收件人在首次接触时理解新品价值、产品身份与下一步行动。
  variant_ids:
  - TPL-LAUNCH-A
  - TPL-LAUNCH-B
  - TPL-LAUNCH-C
- family_id: TF-PROMOTION
  family_name: Theme Promotion
  campaign_type: theme_promotion
  family_objective: 围绕一个真实活动主题组织商品、优惠与截止信息，并保持主命题单一。
  variant_ids:
  - TPL-PROMO-A
  - TPL-PROMO-B
  - TPL-PROMO-C
- family_id: TF-CONVERSION
  family_name: Single Product Conversion
  campaign_type: single_product_conversion
  family_objective: 用最短的可信路径完成单品价值确认、购买阻碍消除与转化。
  variant_ids:
  - TPL-CONVERT-A
  - TPL-CONVERT-B
- family_id: TF-EDUCATION
  family_name: Product Education
  campaign_type: product_education
  family_objective: 帮助用户理解问题、产品机制、使用方法或选择逻辑。
  variant_ids:
  - TPL-EDU-A
  - TPL-EDU-B
  - TPL-EDU-C
- family_id: TF-CATEGORY
  family_name: Category / Multi-product
  campaign_type: category_multi_product
  family_objective: 先建立品类或主题上下文，再帮助用户在多个产品中选择。
  variant_ids:
  - TPL-CATEGORY-A
  - TPL-CATEGORY-B
- family_id: TF-BRAND
  family_name: Brand / Ecosystem Story
  campaign_type: brand_ecosystem_story
  family_objective: 用编辑叙事或生态关系建立品牌理解，并在末段提供自然行动入口。
  variant_ids:
  - TPL-BRAND-A
  - TPL-BRAND-B
templates:
- template_id: TPL-LAUNCH-A
  template_name: Launch A — Product Value First
  template_family_id: TF-LAUNCH
  campaign_type: product_launch
  primary_objective: new_product_value_understanding
  recommended_for:
  - 新品本体与核心价值已经明确
  - 有高质量官方产品主视觉
  - 需要先建立价值再展开功能
  not_recommended_for:
  - 主要任务只是截止提醒
  - 缺少可辨认产品素材
  - 需要先解释陌生问题场景
  product_count_range:
    min: 1
    max: 2
  promotion_level:
  - none
  - low
  - medium
  recommended_module_sequence:
  - MOD-HERO-PRODUCT
  - MOD-STORY-PRIMARY-USP
  - MOD-STORY-FEATURE-SPLIT
  - MOD-STORY-PRODUCT-DETAIL
  - MOD-STORY-LIFESTYLE
  - MOD-TRUST-REVIEW
  - MOD-CONV-CTA-BAND
  - MOD-SYSTEM-BRAND-FOOTER
  optional_modules:
  - MOD-STORY-FEATURE-ICONS
  - MOD-TRUST-AWARD
  - MOD-COMMERCE-PRICE
  required_modules:
  - MOD-HERO-PRODUCT
  - MOD-STORY-PRIMARY-USP
  - MOD-CONV-CTA-BAND
  - MOD-SYSTEM-BRAND-FOOTER
  message_requirement:
    primary_objective_count: 1
    primary_message_count: 1
    primary_usp_count: 1 default
    secondary_usp_count: 2–3 default
    cta_destination_count: 1–2 verified destinations
    japanese_h1: 14–26 characters default; soft max 28; Brand Story may reach 38
    opening_logic: product identity → primary value → proof
  asset_requirement: &1
    official_product_asset: required for sales and launch templates
    asset_provenance: required for every product, UI, package, accessory and installation
      visual
    claim_sources: required before Final
    ai_boundary: environment and atmosphere only; never redraw product or UI
    missing_required_asset: template selection must return BLOCKED or choose a structure
      that does not need the missing optional asset
  desktop_behavior:
    content_width: 600px baseline
    layout: preserve one dominant reading path; split layouts require semantic order
    hero: complete title + recognizable product/proof + primary CTA task without fixed
      height ratio
    hero_layout: product_center or asymmetric split
  mobile_behavior: &2
    qa_viewport: 390px experimental default; also verify 320/375/414/768 review surfaces
    reflow: semantic single-column stacking; never infer order only from desktop position
    cta: full-width permitted; 44px target is Experimental and cannot block Production
    images: preserve aspect ratio; destructive crop forbidden
  applicable_rules:
  - R-BRAND-001
  - R-WEIGHT-001
  - R-ASSET-001
  - R-ASSET-002
  - R-CLAIM-001
  - R-CTA-001
  - R-CTA-004
  - R-MODULE-001
  - R-COPY-002
  - R-EVIDENCE-001
  - R-QA-001
  - R-QA-002
  - R-PRODUCT-001
  - R-HERO-001
  - R-HERO-002
  - R-HERO-004
  - R-MESSAGE-002
  - R-MESSAGE-003
  - R-MODULE-004
  anchor_references:
  - sample_id: SBG_007
    usage: launch structure
    limitation: dual-product/performance tone is not universal
  - sample_id: SBG_019
    usage: single-product launch support
    limitation: neon treatment is product-specific
  confidence:
    level: High
    basis: Tier A launch anchors plus frozen v1.0 launch sequence
    limitations: []
  variable_parts:
  - Feature Split may become Image + Text
  - Price may enter only after value/proof
  - Review Proof may become Award / Media Proof when sourced
- template_id: TPL-LAUNCH-B
  template_name: Launch B — Problem to Solution
  template_family_id: TF-LAUNCH
  campaign_type: product_launch
  primary_objective: problem_recognition_then_product_solution
  recommended_for:
  - 新品解决的痛点需要先被识别
  - 用户对新品类或能力尚不熟悉
  - 有可验证的问题场景资产
  not_recommended_for:
  - 消费者已熟悉品类且只需价格
  - 问题场景会让产品出场过晚
  - Lifestyle 资产无法连接产品事实
  product_count_range:
    min: 1
    max: 2
  promotion_level:
  - none
  - low
  recommended_module_sequence:
  - MOD-HERO-LIFESTYLE
  - MOD-STORY-PROBLEM
  - MOD-STORY-PRIMARY-USP
  - MOD-STORY-IMAGE-TEXT
  - MOD-STORY-PRODUCT-DETAIL
  - MOD-TRUST-REVIEW
  - MOD-CONV-CTA-BAND
  - MOD-SYSTEM-BRAND-FOOTER
  optional_modules:
  - MOD-STORY-FAQ
  - MOD-STORY-FEATURE-SPLIT
  - MOD-COMMERCE-PRICE
  required_modules:
  - MOD-HERO-LIFESTYLE
  - MOD-STORY-PROBLEM
  - MOD-STORY-PRIMARY-USP
  - MOD-CONV-CTA-BAND
  - MOD-SYSTEM-BRAND-FOOTER
  message_requirement:
    primary_objective_count: 1
    primary_message_count: 1
    primary_usp_count: 1 default
    secondary_usp_count: 2–3 default
    cta_destination_count: 1–2 verified destinations
    japanese_h1: 14–26 characters default; soft max 28; Brand Story may reach 38
    opening_logic: consumer problem → product answer → evidence
  asset_requirement:
    official_product_asset: required for sales and launch templates
    asset_provenance: required for every product, UI, package, accessory and installation
      visual
    claim_sources: required before Final
    ai_boundary: environment and atmosphere only; never redraw product or UI
    missing_required_asset: template selection must return BLOCKED or choose a structure
      that does not need the missing optional asset
    lifestyle_asset: required and must connect visibly to the verified product
  desktop_behavior:
    content_width: 600px baseline
    layout: preserve one dominant reading path; split layouts require semantic order
    hero: complete title + recognizable product/proof + primary CTA task without fixed
      height ratio
    hero_layout: lifestyle full-width or split with recognizable product
  mobile_behavior:
    qa_viewport: 390px experimental default; also verify 320/375/414/768 review surfaces
    reflow: semantic single-column stacking; never infer order only from desktop position
    cta: full-width permitted; 44px target is Experimental and cannot block Production
    images: preserve aspect ratio; destructive crop forbidden
    stack_order: problem context → product solution; product cannot disappear below
      a long intro
  applicable_rules:
  - R-BRAND-001
  - R-WEIGHT-001
  - R-ASSET-001
  - R-ASSET-002
  - R-CLAIM-001
  - R-CTA-001
  - R-CTA-004
  - R-MODULE-001
  - R-COPY-002
  - R-EVIDENCE-001
  - R-QA-001
  - R-QA-002
  - R-PRODUCT-001
  - R-HERO-001
  - R-HERO-002
  - R-HERO-004
  - R-MODULE-003
  - R-MODULE-004
  - R-COPY-005
  anchor_references:
  - sample_id: SBG_007
    usage: value-to-proof launch pacing
    limitation: problem framing must remain product-specific
  - sample_id: SBG_016
    usage: Japan home-context product integration
    limitation: warm home styling is category-specific
  confidence:
    level: Medium
    basis: Strong Tier A components; exact problem-first sequence still needs template
      validation
    limitations: []
  variable_parts:
  - Problem may be one scene or two short contrasts
  - FAQ enters only for known objections
  - Lifestyle Hero can switch to Product Focus if product recognition weakens
