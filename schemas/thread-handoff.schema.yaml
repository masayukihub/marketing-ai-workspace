$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/masayukihub/marketing-ai-workspace/schemas/thread-handoff.schema.yaml
title: Codex Thread Handoff
description: Minimal file-backed recovery contract; never a Product Truth or Decision authority.
type: object
additionalProperties: false
required:
  - schema_version
  - handoff_id
  - created_at
  - repository
  - project
  - goal
  - success_criteria
  - completed
  - accepted_decisions
  - changed_files
  - generated_artifacts
  - tests
  - blockers
  - unresolved_questions
  - next_action
  - required_reads
  - forbidden_changes
  - resume
properties:
  schema_version: {const: "1.0"}
  handoff_id: {type: string, pattern: "^[a-z0-9][a-z0-9-]{7,80}$"}
  created_at: {type: string, format: date-time}
  repository:
    type: object
    additionalProperties: false
    required: [base_commit, head_commit, branch, worktree, git_status]
    properties:
      base_commit: {$ref: "#/$defs/commit"}
      head_commit: {$ref: "#/$defs/commit"}
      branch: {type: string, minLength: 1}
      worktree: {type: string, minLength: 1}
      git_status:
        type: array
        maxItems: 200
        items: {type: string, maxLength: 500}
  project:
    type: object
    additionalProperties: false
    required: [project_id, task_type, manifest, effective_freshness]
    properties:
      project_id: {type: string, minLength: 1}
      task_type: {type: string, minLength: 1}
      manifest: {type: [string, "null"]}
      effective_freshness: {enum: [current, stale, unknown, not_applicable]}
  goal: {type: string, minLength: 1, maxLength: 1200}
  success_criteria:
    type: array
    maxItems: 20
    items: {type: string, maxLength: 500}
  completed:
    type: array
    maxItems: 40
    items: {type: string, maxLength: 500}
  accepted_decisions:
    type: array
    maxItems: 20
    items:
      type: object
      additionalProperties: false
      required: [decision_id, source]
      properties:
        decision_id: {type: string, minLength: 1, maxLength: 200}
        source: {type: string, minLength: 1, maxLength: 500}
  changed_files:
    type: array
    maxItems: 200
    items: {type: string, maxLength: 500}
  generated_artifacts:
    type: array
    maxItems: 40
    items: {type: string, maxLength: 500}
  tests:
    type: array
    maxItems: 40
    items: {type: string, maxLength: 500}
  blockers:
    type: array
    maxItems: 30
    items: {type: string, maxLength: 800}
  unresolved_questions:
    type: array
    maxItems: 30
    items: {type: string, maxLength: 800}
  next_action: {type: string, minLength: 1, maxLength: 1200}
  required_reads:
    type: array
    minItems: 1
    maxItems: 12
    uniqueItems: true
    items: {type: string, minLength: 1, maxLength: 500}
  forbidden_changes:
    type: array
    maxItems: 40
    items: {type: string, maxLength: 500}
  resume:
    type: object
    additionalProperties: false
    required: [recommended_new_thread_name, bootstrap_prompt]
    properties:
      recommended_new_thread_name: {type: string, minLength: 1, maxLength: 200}
      bootstrap_prompt: {type: string, minLength: 1, maxLength: 6000}
$defs:
  commit:
    type: string
    pattern: "^(?:[0-9a-f]{40}|unknown)$"
