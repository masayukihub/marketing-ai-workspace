schema_version: "1.0"
recipe_id: RECIPE-EDM-PRODUCT-LAUNCH-PROOF
name: EDM Product Launch — Product First → Proof → Action
pattern_type: page_recipe
lifecycle:
  status: CANDIDATE
  validation_scope: S30 mini Amazon-to-EDM vertical-slice structure only; no production or send approval.
channels: [edm]
project_visual_dna_inheritance:
  allowed: true
  inherited_layers: [tone, proof_strategy, visual_rhythm, image_strategy, information_strategy, conversion_style, mobile_priority]
  forbidden_layers: [channel_information_density, amazon_gallery_layout, amazon_aplus_layout, amazon_copy, product_claim, product_asset, commerce_fact]
sequence:
  - position: 1
    role: product_first_hero
    pattern_id: SEC-EDM-PRODUCT-FIRST-HERO
    existing_module: MOD-HERO-PRODUCT
    requirement: REQUIRED
  - position: 2
    role: consumer_problem
    pattern_id: SEC-EDM-CONSUMER-PROBLEM
    existing_module: MOD-STORY-PROBLEM
    requirement: CONDITIONAL
    condition: Consumer problem recognition is insufficient for the selected audience.
  - position: 3
    role: benefit_summary
    pattern_id: SEC-EDM-BENEFIT-SUMMARY
    existing_module: MOD-STORY-PRIMARY-USP
    requirement: REQUIRED
  - position: 4
    role: mechanism_proof
    pattern_id: SEC-EDM-MECHANISM-PROOF
    existing_module: MOD-STORY-PRODUCT-DETAIL
    requirement: CONDITIONAL
    condition: Mechanism proof is material to value understanding and approved evidence exists.
  - position: 5
    role: product_or_lifestyle_context
    existing_module: MOD-STORY-LIFESTYLE
    new_pattern_created: false
    requirement: OPTIONAL
  - position: 6
    role: app_or_automation
    pattern_id: SEC-EDM-APP-AUTOMATION
    existing_module: MOD-STORY-APP-UI
    requirement: CONDITIONAL
    condition: App or automation is material and current approved UI evidence exists.
  - position: 7
    role: purchase_cta
    pattern_id: SEC-EDM-CHANNEL-CTA
    existing_module: MOD-CONV-CTA-BAND
    requirement: REQUIRED
  - position: 8
    role: brand_footer
    existing_module: MOD-SYSTEM-BRAND-FOOTER
    new_pattern_created: false
    requirement: REQUIRED
  - position: 9
    role: legal_note
    existing_module: MOD-SYSTEM-LEGAL-FOOTER
    new_pattern_created: false
    requirement: CONDITIONAL
    condition: Current Claim, offer, channel or legal requirement needs a readable disclosure.
template_selection_request:
  campaign_type: product_launch
  primary_objective: new_product_value_understanding
  opening_logic: product_identity_to_primary_value_to_proof
  required_roles:
    - {role_id: product_first_hero, module_id: MOD-HERO-PRODUCT}
    - {role_id: benefit_summary, module_id: MOD-STORY-PRIMARY-USP}
    - {role_id: purchase_cta, module_id: MOD-CONV-CTA-BAND}
    - {role_id: brand_footer, module_id: MOD-SYSTEM-BRAND-FOOTER}
  optional_roles:
    - {role_id: consumer_problem, module_id: MOD-STORY-PROBLEM, requirement: CONDITIONAL}
    - {role_id: mechanism_proof, module_id: MOD-STORY-PRODUCT-DETAIL, requirement: CONDITIONAL}
    - {role_id: product_or_lifestyle_context, module_id: MOD-STORY-LIFESTYLE, requirement: OPTIONAL}
    - {role_id: app_or_automation, module_id: MOD-STORY-APP-UI, requirement: CONDITIONAL}
    - {role_id: legal_note, module_id: MOD-SYSTEM-LEGAL-FOOTER, requirement: CONDITIONAL}
template_compatibility:
  recommended_template: TPL-LAUNCH-A
  mapping_status: CANDIDATE_CONDITIONAL_MATCH
  selector_owner: skills/edm-generator/generator/template_selector/selector.rb
  stable_selector_override_allowed: false
  rule: Recipe submits intent and role requirements; the Stable Template Selector owns the final Template decision.
required_gates: [Product Truth, Claim Gate, Product Layer, Asset Gate, Human Review, Hardening, Mobile QA, ESP Gate]
sources:
  - visual-system/references/ingested/switchbot-edm-master-v1/analysis.yaml
  - skills/edm-generator/design_system/templates_v1.0.yaml
  - skills/edm-generator/design_system/modules_v1.0.yaml
  - skills/edm-generator/brand_system/switchbot_approved_reverse_engineering_v1.0.yaml
prohibited_content: [mailchimp_mc_implementation, original_copy, product_image, price, coupon, claim, complete_layout, trade_dress]
