name: System Consistency

on:
  pull_request:
    paths:
      - "skills/**"
      - "AGENTS.md"
      - "runtime/skill-lock.json"
      - "projects/*/project.yaml"
      - "projects/*/chatgpt-context.md"
      - "memory/project-memory/**"
      - "chatgpt/**"
      - "inventory/skill_inventory.csv"
      - "docs/SKILL_CATALOG.md"
      - "scripts/build_skill_inventory.py"
      - "scripts/build_chatgpt_context.py"
      - "scripts/build_skill_lock.py"
      - "scripts/runtime_contract.py"
      - "scripts/verify_codex_runtime.py"
      - "scripts/sync_codex_skill_mirror.py"
      - "scripts/audit_personal_skill_mirrors.py"
      - "tests/test_personal_skill_mirrors.py"
      - "tests/test_system_consistency.py"
      - ".github/workflows/system-consistency.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "AGENTS.md"
      - "runtime/skill-lock.json"
      - "projects/*/project.yaml"
      - "projects/*/chatgpt-context.md"
      - "memory/project-memory/**"
      - "chatgpt/**"
      - "inventory/skill_inventory.csv"
      - "docs/SKILL_CATALOG.md"
      - "scripts/**"
      - "tests/test_system_consistency.py"
      - "tests/test_personal_skill_mirrors.py"
      - ".github/workflows/system-consistency.yml"
  workflow_dispatch:

concurrency:
  group: system-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install validation dependencies
        run: python -m pip install "pytest>=8,<9" PyYAML
      - name: Verify repository Runtime against Skill Lock
        run: python scripts/verify_codex_runtime.py --repository-only
      - name: Verify generated Inventory and ChatGPT snapshots
        run: |
          python scripts/build_skill_inventory.py --check
          python scripts/build_chatgpt_context.py --check
      - name: Validate Project Manifests
        run: python skills/project-context-resolver/scripts/resolve_project_context.py --workspace . --validate-all
      - name: Run Resolver and Runtime tests
        run: >-
          python -m pytest -q
          tests/test_system_consistency.py
          skills/project-context-resolver/tests
          skills/project-memory-manager/tests
      - name: Workspace and Secret validation
        run: python tests/validate_workspace.py
      - name: Verify personal catalog adapter with offline fixtures
        run: python -m unittest discover -s tests -p test_personal_skill_mirrors.py -v
