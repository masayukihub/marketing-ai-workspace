name: Skill Tests

on:
  pull_request:
    paths: ["skills/**", "tests/run_skill_tests.sh", ".github/workflows/skill-tests.yml"]
  push:
    branches: [main]
    paths: ["skills/**", "tests/run_skill_tests.sh", ".github/workflows/skill-tests.yml"]
  workflow_dispatch:

concurrency:
  group: skill-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: ruby/setup-ruby@v1
        with: {ruby-version: "3.3"}
      - name: Install Python test dependencies
        run: >-
          python -m pip install "pytest>=8,<9" openpyxl "pandas>=2.2,<3" pyarrow PyYAML xlrd
          matplotlib Jinja2 pdfplumber
      - name: Run Skill tests
        run: bash tests/run_skill_tests.sh
