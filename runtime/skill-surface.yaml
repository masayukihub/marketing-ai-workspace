  - directory_name: "amazon-japan-pdp-generator"
    declared_skill_name: "amazon-japan-pdp-generator"
    canonical_entry: "jp-commerce-content-flow"
    internal_role: "SPEC_TEMPLATE_RENDERER"
    scopes: ["codex_global"]
  - directory_name: "amazon-listing-creative"
    declared_skill_name: "amazon-listing-creative"
    canonical_entry: "jp-commerce-content-flow"
    internal_role: "CONTROLLED_CREATIVE_MODULE"
    scopes: ["codex_global"]
  - directory_name: "jp-commerce-creative-flow"
    declared_skill_name: "jp-commerce-creative-flow"
    canonical_entry: "jp-commerce-content-flow"
    internal_role: "SOURCE_GOVERNANCE_OVERLAY"
    scopes: ["codex_global", "project"]
  - directory_name: "japan-listing-demo"
    declared_skill_name: "japan-listing-demo"
    canonical_entry: "jp-commerce-content-flow"
